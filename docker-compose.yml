services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: todo_db
      POSTGRES_USER: todo_user
      POSTGRES_PASSWORD: todo_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: ./entrypoint.sh
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://todo_user:todo_pass@db:5432/todo_db
    depends_on:
      - db
    volumes:
      - .:/app

volumes:
  postgres_data:
