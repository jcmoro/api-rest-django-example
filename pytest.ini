# DJANGO_SETTINGS_MODULE → indica dónde están tus settings (api/settings.py).
# --reuse-db → reutiliza la base de datos de test si ya existe.
# --migrations → aplica las migraciones reales (soluciona el error de auth_user).
# -q → salida concisa de pytest.
[pytest]
DJANGO_SETTINGS_MODULE = api.settings
python_files = tests.py test_*.py *_tests.py
testpaths = tasks/tests
pythonpath = .
addopts = --migrations --reuse-db
